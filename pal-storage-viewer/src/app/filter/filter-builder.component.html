<ng-container *ngTemplateOutlet="groupTpl; context: { $implicit: root, parent: null, depth: 0 }"></ng-container>

<section class="sort-section" aria-label="Sort by">
  <div class="group-head"><strong>Sort by</strong><span class="match-word">First priority at the top</span><button class="ghost" type="button" (click)="addSort()">+ sort</button></div>
  <p class="empty-group" *ngIf="!sorts.length">Default location, file and slot order.</p>
  <div class="sort-rule" *ngFor="let sort of sorts; let index = index"
    [class.sort-dragging]="sortDrag?.active && sortDrag?.from === index"
    [class.sort-drop-before]="sortDrag?.active && sortDrag?.to === index && sortDrag!.to < sortDrag!.from"
    [class.sort-drop-after]="sortDrag?.active && sortDrag?.to === index && sortDrag!.to > sortDrag!.from"
    [style.transform]="sortDrag?.active && sortDrag?.from === index ? 'translateY(' + sortDrag!.offset + 'px)' : null"
    (pointerdown)="startSortDrag($event, index)" (pointermove)="moveSortDrag($event)"
    (pointerup)="endSortDrag($event)" (pointercancel)="endSortDrag($event, false)" (lostpointercapture)="endSortDrag($event, false)">
    <button type="button" class="sort-priority" [attr.aria-label]="'Reorder sort priority ' + (index + 1)"
      title="Drag to reorder. Use arrow keys to move."
      (keydown.arrowup)="moveSort(index, -1); $event.preventDefault()" (keydown.arrowdown)="moveSort(index, 1); $event.preventDefault()">
      <svg viewBox="0 0 8 12" aria-hidden="true"><path d="M2 2h0M6 2h0M2 6h0M6 6h0M2 10h0M6 10h0"/></svg>{{ index + 1 }}
    </button>
    <select aria-label="Sort field" [value]="sort.field" (change)="setSortField(index, $event)">
      <option *ngFor="let field of availableSortFields(index)" [value]="field.key" [selected]="field.key === sort.field">{{ field.label }}</option>
    </select>
    <select aria-label="Sort direction" [value]="sort.direction" (change)="setSortDirection(index, $event)">
      <option value="asc" [selected]="sort.direction === 'asc'">Ascending ↑</option>
      <option value="desc" [selected]="sort.direction === 'desc'">Descending ↓</option>
    </select>
    <span class="sort-actions">
      <button class="icon" type="button" aria-label="Increase sort priority" [disabled]="index === 0" (click)="moveSort(index, -1)">↑</button>
      <button class="icon" type="button" aria-label="Decrease sort priority" [disabled]="index === sorts.length - 1" (click)="moveSort(index, 1)">↓</button>
      <button class="icon" type="button" aria-label="Remove sort" (click)="removeSort(index)">×</button>
    </span>
  </div>
</section>

<ng-template #groupTpl let-group let-parent="parent" let-depth="depth">
  <div class="group" [class.root]="depth === 0" [class.negated]="group.negate" [class.any]="group.combinator === 'or'">
    <div class="group-head">
      <ng-container *ngIf="group.scope">
        <select aria-label="Matching moves" [value]="group.match || 'any'" (change)="setMoveMatch(group, $event)">
          <option value="any" [selected]="!group.match || group.match === 'any'">At least one</option>
          <option value="none" [selected]="group.match === 'none'">No</option>
          <option value="all" [selected]="group.match === 'all'">Every</option>
        </select>
        <select aria-label="Move scope" [value]="group.scope" (change)="setMoveScope(group, $event)">
          <option *ngFor="let scope of moveScopes" [value]="scope.key" [selected]="scope.key === group.scope">{{ scope.label }}</option>
        </select>
      </ng-container>
      <span class="match-word">{{ group.negate ? 'Exclude pals matching' : 'Match' }}</span>
      <span class="combinator" role="group" aria-label="Combine rules with">
        <button
          type="button"
          [class.active]="group.combinator === 'and'"
          (click)="setCombinator(group, 'and')"
        >all</button>
        <button
          type="button"
          [class.active]="group.combinator === 'or'"
          (click)="setCombinator(group, 'or')"
        >any</button>
      </span>
      <span class="match-word">of these</span>

      <span class="group-actions">
        <button class="ghost" type="button" (click)="addRule(group)">+ rule</button>
        <button class="ghost" type="button" *ngIf="!group.scope" (click)="addGroup(group)">+ group</button>
        <button class="ghost" type="button" *ngIf="!group.scope" (click)="addMoveGroup(group)">+ move filter</button>
        <button
          *ngIf="depth > 0"
          class="ghost"
          type="button"
          [class.active]="group.negate"
          title="Invert this group"
          (click)="toggleNegate(group)"
        >NOT</button>
        <button
          *ngIf="depth > 0 && parent"
          class="icon"
          type="button"
          aria-label="Remove group"
          title="Remove group"
          (click)="remove(parent, group)"
        >×</button>
      </span>
    </div>

    <p class="empty-group" *ngIf="!group.children.length">
      No rules. <button class="ghost inline-add" type="button" (click)="addRule(group)">+ rule</button>
    </p>

    <div class="children">
      <ng-container *ngFor="let child of group.children; let index = index; trackBy: trackNode">
        <div class="child" [class.first]="index === 0">
          <span class="joiner" aria-hidden="true">{{ index === 0 ? '' : (group.combinator === 'and' ? 'and' : 'or') }}</span>

          <ng-container *ngIf="child.type === 'rule'; else nestedGroup">
            <div class="rule" [class.unknown]="isUnknownField(child)">
              <app-filter-field-picker class="rule-field" [fields]="availableFields(child)" [value]="child.field"
                [hint]="hint(child)" label="Filter field" (valueChange)="setField(child, $event)"></app-filter-field-picker>

              <select class="op" [value]="child.op" (change)="onOperatorChange(child, $event)">
                <option *ngFor="let def of operatorsFor(child)" [value]="def.op" [selected]="def.op === child.op">{{ def.label }}</option>
              </select>

              <select *ngIf="hasComparisonMode(child)" class="compare-mode" aria-label="Compare with" [value]="comparisonMode(child)" (change)="setComparisonMode(child, $event)">
                <option value="value" [selected]="comparisonMode(child) === 'value'">Value</option>
                <option value="field" [selected]="comparisonMode(child) === 'field'">% of field</option>
                <option value="formula" [selected]="comparisonMode(child) === 'formula'">Formula</option>
              </select>
              <span class="reference-value" *ngIf="hasComparisonMode(child) && comparisonMode(child) === 'field'; else formulaValue">
                <input class="value percent" type="number" aria-label="Percentage of field" [value]="referencePercent(child)" (input)="setPercent(child, $event)">
                <span>% of</span>
                <app-filter-field-picker [fields]="numericFields(child)" [value]="referenceField(child)" label="Comparison field"
                  (valueChange)="setReference(child, $event)"></app-filter-field-picker>
              </span>
              <ng-template #formulaValue>
                <app-filter-field-picker *ngIf="hasComparisonMode(child) && comparisonMode(child) === 'formula'; else literalValue"
                  class="value-wrap" [expression]="true" [fields]="numericFields(child)" [value]="singleValue(child, 0)" label="Formula"
                  [placeholder]="placeholder(child)" (valueChange)="onFormulaInput(child, $event)"></app-filter-field-picker>
              </ng-template>
              <ng-template #literalValue>
              <ng-container [ngSwitch]="arity(child)">
                <ng-container *ngSwitchCase="'none'"></ng-container>

                <ng-container *ngSwitchCase="'two'">
                  <input
                    class="value narrow"
                    type="number"
                    [value]="singleValue(child, 0)"
                    [placeholder]="placeholder(child, 0)"
                    (input)="onSlotInput(child, 0, $event)"
                  >
                  <span class="dash">–</span>
                  <input
                    class="value narrow"
                    type="number"
                    [value]="singleValue(child, 1)"
                    [placeholder]="placeholder(child, 1)"
                    (input)="onSlotInput(child, 1, $event)"
                  >
                </ng-container>

                <span class="value-wrap" *ngSwitchDefault>
                  <input
                    #valueInput
                    class="value"
                    [class.narrow]="inputType(child) === 'number'"
                    [type]="inputType(child)"
                    [value]="valueText(child)"
                    [placeholder]="placeholder(child)"
                    autocomplete="off"
                    spellcheck="false"
                    (input)="onValueInput(child, $event)"
                    (focus)="onValueFocus(child, $event)"
                    (blur)="onValueBlur(child)"
                    (keydown)="onValueKeydown(child, $event)"
                  >
                  <ul class="suggestions" *ngIf="suggestionsFor(child).length" role="listbox">
                    <li
                      *ngFor="let item of suggestionsFor(child); let i = index"
                      role="option"
                      [class.active]="i === suggestionIndex(child)"
                      [attr.aria-selected]="i === suggestionIndex(child)"
                      (mousedown)="$event.preventDefault(); pickSuggestion(child, item, valueInput)"
                    >
                      <span class="suggest-value">{{ item.value }}</span>
                      <span class="suggest-count">{{ item.count }}</span>
                    </li>
                  </ul>
                </span>
              </ng-container>
              </ng-template>

              <span
                class="rule-count"
                *ngIf="countFor(child) !== null"
                [class.zero]="countFor(child) === 0"
                title="Pals matching this rule on its own"
              >{{ countFor(child) }}</span>

              <span class="rule-actions">
                <button class="icon" type="button" aria-label="Duplicate rule" title="Duplicate" (click)="duplicate(group, child)">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="9" y="9" width="11" height="11" rx="2"/>
                    <path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/>
                  </svg>
                </button>
                <button class="icon" type="button" aria-label="Remove rule" title="Remove" (click)="remove(group, child)">×</button>
              </span>
              <span class="rule-error" *ngIf="errorFor(child) as error" role="status">{{ error }}</span>
            </div>
          </ng-container>

          <ng-template #nestedGroup>
            <ng-container *ngTemplateOutlet="groupTpl; context: { $implicit: child, parent: group, depth: depth + 1 }"></ng-container>
          </ng-template>
        </div>
      </ng-container>
    </div>
  </div>
</ng-template>
