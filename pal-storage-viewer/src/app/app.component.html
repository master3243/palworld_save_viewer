<main class="page">
  <section class="toolbar">
    <span class="logo-crop">
      <img
        class="title-logo"
        src="https://cdn.cloudflare.steamstatic.com/steam/apps/1623730/logo.png?t=1622889070"
        alt="Palworld"
      >
    </span>
    <span class="viewer-title">Storage Viewer</span>
  </section>

  <label
    *ngIf="!rows.length"
    class="dropzone"
    [class.dragging]="isDragging"
    [class.busy]="isParsing"
    (drop)="onDrop($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
  >
    <input type="file" accept=".sav,.gvas" (change)="onFileInput($event)">
    <span class="spinner" *ngIf="isParsing" aria-hidden="true"></span>
    <span class="drop-title">{{ isParsing ? 'Loading' : 'Drop save file here' }}</span>

    <button
      class="demo-button"
      type="button"
      *ngIf="!isParsing"
      (click)="openDemoPrompt($event)"
    >
      <span class="demo-glyph" aria-hidden="true">&#9654;</span>
      <span>Demo</span>
    </button>
  </label>

  <div
    class="modal-backdrop"
    *ngIf="isDemoPromptOpen"
    (click)="closeDemoPrompt()"
  >
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="demoPromptTitle"
      (click)="$event.stopPropagation()"
    >
      <h2 class="modal-title" id="demoPromptTitle">Load demo save?</h2>
      <div class="modal-actions">
        <button class="modal-ghost" type="button" (click)="closeDemoPrompt()">Cancel</button>
        <button class="modal-primary" type="button" (click)="loadDemoSave()">Load</button>
      </div>
    </div>
  </div>

  <p class="error" *ngIf="error">{{ error }}</p>

  <section class="table-shell" *ngIf="rows.length">
    <div class="table-tools">
      <button
        class="gear-button"
        type="button"
        aria-label="Column settings"
        [attr.aria-expanded]="isColumnMenuOpen"
        (click)="toggleColumnMenu()"
      >
        &#9881;
      </button>

      <div class="column-menu" *ngIf="isColumnMenuOpen">
        <label *ngFor="let column of columns; trackBy: trackColumn">
          <input type="checkbox" [checked]="column.visible" (change)="toggleColumn(column)">
          <span>{{ column.title }}</span>
        </label>
      </div>
    </div>

    <div class="table-scroll" #tableScroll (scroll)="onTableScroll($event)">
      <table>
        <thead>
          <tr>
            <th class="arrow-cell"></th>
            <th
              *ngFor="let column of displayedColumns; trackBy: trackColumn"
              [class.pal-name-cell]="column.key === 'pal_name'"
              [style.width.px]="column.key === 'pal_name' ? palNameWidth : null"
              [class.icon-cell]="column.key === 'pal_variant' || column.key === 'gender' || column.key === 'is_lucky' || column.key === 'favorite_index'"
              [class.slot-cell]="isSlotNumber(column)"
              [class.soul-rank-cell]="isSoulRank(column)"
              [class.sorted]="sortColumn === column.key"
              [title]="column.title"
              (click)="toggleSort(column)"
            >
              <span class="sort-marker" *ngIf="sortMarker(column)">{{ sortMarker(column) }}</span>
              <span class="header-label">{{ column.label }}</span>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr class="spacer-row" *ngIf="topSpacerHeight > 0">
            <td [attr.colspan]="detailColspan" [style.height.px]="topSpacerHeight"></td>
          </tr>
          <ng-container *ngFor="let item of virtualRows; trackBy: trackVirtualRow">
            <tr
              class="data-row"
              [attr.data-row-index]="item.index"
              [class.open]="isRowOpen(item.index)"
              (click)="toggleRow(item.index, $event)"
            >
              <td class="arrow-cell">
                <button
                  class="row-toggle"
                  type="button"
                  [attr.aria-label]="isRowOpen(item.index) ? 'Collapse Pal details' : 'Expand Pal details'"
                  [attr.aria-expanded]="isRowOpen(item.index)"
                  (click)="$event.stopPropagation(); toggleRow(item.index, $event)"
                >
                  <span class="row-arrow" [class.open]="isRowOpen(item.index)">&gt;</span>
                </button>
              </td>
              <td
                *ngFor="let column of displayedColumns; trackBy: trackColumn"
                [class.pal-name-cell]="column.key === 'pal_name'"
                [class.icon-cell]="column.key === 'pal_variant' || column.key === 'gender' || column.key === 'is_lucky' || column.key === 'favorite_index'"
                [class.slot-cell]="isSlotNumber(column)"
                [class.sorted-column]="sortColumn === column.key"
                [class.soul-rank-cell]="isSoulRank(column)"
                [title]="cellTitle(item.row, column)"
              >
                <span
                  *ngIf="column.key === 'pal_variant' && isAlpha(item.row)"
                  aria-label="Alpha"
                >
                  <img *ngIf="alphaImageSrc" class="alpha-icon" [src]="alphaImageSrc" alt="Alpha">
                </span>
                <span
                  *ngIf="column.key === 'gender' && isFemale(item.row)"
                  class="gender-icon female"
                  aria-label="Female"
                >
                  ♀
                </span>
                <span
                  *ngIf="column.key === 'gender' && isMale(item.row)"
                  class="gender-icon male"
                  aria-label="Male"
                >
                  ♂
                </span>
                <span
                  *ngIf="column.key === 'is_lucky' && isLucky(item.row)"
                  class="lucky-icon"
                  aria-label="Lucky"
                >
                  ★
                </span>
                <ng-container *ngIf="column.key === 'favorite_index' && favoriteIndex(item.row) as favorite">
                  <img
                    *ngIf="favoriteImageSrcs[favorite] as favoriteSource"
                    class="favorite-icon"
                    [src]="favoriteSource"
                    alt=""
                    [attr.aria-label]="'Favorite ' + favorite"
                  >
                </ng-container>
                <ng-container *ngIf="column.key !== 'pal_variant' && column.key !== 'gender' && column.key !== 'is_lucky' && column.key !== 'favorite_index'">
                  {{ cellDisplay(item.row, column) }}
                </ng-container>
              </td>
            </tr>
            <tr class="detail-row" *ngIf="isRowOpen(item.index)">
              <td [attr.colspan]="detailColspan">
                <app-pal-detail-card [row]="item.row"></app-pal-detail-card>
              </td>
            </tr>
          </ng-container>
          <tr class="spacer-row" *ngIf="bottomSpacerHeight > 0">
            <td [attr.colspan]="detailColspan" [style.height.px]="bottomSpacerHeight"></td>
          </tr>
          <tr *ngIf="!displayedColumns.length">
            <td [attr.colspan]="detailColspan">
              <button class="empty-columns" type="button" (click)="toggleColumnMenu()">
                &#9881;
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <div class="github-meta">
    <a
      class="github-link"
      href="https://github.com/master3243/palworld_save_viewer"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="View Palworld Save Viewer on GitHub"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.1-.75.4-1.27.74-1.56-2.57-.29-5.27-1.29-5.27-5.68 0-1.25.45-2.28 1.2-3.08-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.17a10.9 10.9 0 0 1 5.75 0c2.19-1.48 3.16-1.17 3.16-1.17.63 1.58.23 2.76.11 3.05.75.8 1.2 1.83 1.2 3.08 0 4.4-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
      </svg>
    </a>
    <span class="app-version">{{ appVersion }}</span>
  </div>
</main>
