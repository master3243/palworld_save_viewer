# Builds the Angular app and publishes it to GitHub Pages on every push to main.
# One-time setup in the repository: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pal-storage-viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pal-storage-viewer/package-lock.json

      - run: npm ci

      # index.html uses <base href="./"> and every asset URL is relative, so the
      # same build works at the root of a domain or under /<repo>/ on Pages.
      - run: npx ng build --configuration production

      # Pages runs Jekyll by default, which drops files and folders starting with
      # an underscore; this file turns that off.
      - run: touch dist/pal-storage-viewer/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pal-storage-viewer/dist/pal-storage-viewer/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
